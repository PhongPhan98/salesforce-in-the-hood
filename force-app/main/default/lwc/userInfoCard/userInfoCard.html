<template>
    <div class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:user" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Current User Info</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <template if:true={user.data}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                        <p class="slds-text-title_bold">Name</p>
                        <p>{name}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-p-bottom_small">
                        <p class="slds-text-title_bold">Email</p>
                        <p>{email}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1">
                        <p class="slds-text-title_bold">Title</p>
                        <p>{title}</p>
                    </div>
                </div>
            </template>

            <template if:true={hasError}>
                <div class="slds-text-color_error">
                    Error loading user info.
                </div>
            </template>
        </div>
    </div>
</template>
